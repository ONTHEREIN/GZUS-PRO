[project]
name = "onegzus-api"
version = "0.0.1"
description = "FastAPI backend for GZUS teaching affairs assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.19.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "packaging>=24.0",
  "ddddocr>=1.5.0",
  "Pillow>=10.0.0",
  "cryptography>=42.0.0",
  "rsa>=4.9.0",
  "pywebpush>=1.14.0",
  "slowapi>=0.1.0",
  "requests>=2.31.0",
  "pyquery>=2.0.0",
  "fake-headers>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/vendor"]

[tool.ruff.lint]
# 显式固定经典默认规则集（E4/E7/E9/F：导入/语句/语法/真实缺陷）。
# ruff 新版本（>=0.9）默认规则集大幅扩容（UP/B/S/I/RUF 等风格类规则），
# 不显式 select 会导致 CI 与本地结果随版本漂移；这里固定为项目实际可满足的
# 规则集，CI 才能稳定把关。风格类债务（UP017/BLE001/B008 等）另行跟进。
select = ["E4", "E7", "E9", "F"]
