[project]
name = "onegzus-api"
version = "0.0.1"
description = "FastAPI backend for GZUS teaching affairs assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.19.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "packaging>=24.0",
  "ddddocr>=1.5.0",
  "Pillow>=10.0.0",
  "cryptography>=42.0.0",
  "rsa>=4.9.0",
  "pywebpush>=1.14.0",
  "slowapi>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
school = [
  "school-sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
