    <style>
        .more-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .more-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px 16px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.4s var(--transition);
            animation: cardEnter 0.6s var(--transition) both;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .more-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }
        .more-card:nth-child(1) { animation-delay: 0.05s; }
        .more-card:nth-child(2) { animation-delay: 0.1s; }
        .more-card:nth-child(3) { animation-delay: 0.15s; }
        .more-card:nth-child(4) { animation-delay: 0.2s; }
        .more-card:nth-child(5) { animation-delay: 0.25s; }
        .more-card:nth-child(6) { animation-delay: 0.3s; }
        .more-card:nth-child(7) { animation-delay: 0.35s; }
        .more-card:nth-child(8) { animation-delay: 0.4s; }
        .more-card:nth-child(9) { animation-delay: 0.45s; }
        .more-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--transition);
        }
        .more-card:hover .more-icon {
            transform: scale(1.1);
        }
        .more-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
        }
        .more-desc {
            font-size: 12px;
            color: var(--secondary);
        }
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .quick-settings {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: cardEnter 0.6s var(--transition) both;
            animation-delay: 0.5s;
        }
        .quick-setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.3s;
        }
        .quick-setting-item:last-child {
            border-bottom: none;
        }
        .quick-setting-item:hover {
            background: var(--bg);
        }
        .quick-setting-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .quick-setting-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-light);
            color: var(--accent);
        }
        .quick-setting-text {
            font-weight: 600;
            font-size: 15px;
        }
        .quick-setting-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quick-setting-value {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 500;
        }
        select {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 14px;
            color: var(--primary);
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        select:focus {
            border-color: var(--accent);
        }
        @media (max-width: 768px) {
            .more-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .more-card {
                padding: 16px 8px;
            }
            .more-icon {
                width: 44px;
                height: 44px;
            }
            .more-title {
                font-size: 13px;
            }
            .more-desc {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .more-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }
    </style>

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            function updateThemeUI() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const icon = document.getElementById('theme-icon');
                if (icon) {
                    icon.innerHTML = isDark
                        ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
                        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
                }
                const toggleUI = document.getElementById('theme-toggle-ui');
                if (toggleUI) {
                    toggleUI.classList.toggle('active', isDark);
                }
            }
            window.toggleTheme = function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const next = isDark ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeUI();
            };
            updateThemeUI();
        })();
    </script>
