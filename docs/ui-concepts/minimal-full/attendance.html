        <main class="main">
            <header class="header">
                <div class="greeting">
                    <h1>考勤记录</h1>
                    <p>2023-2024学年 第二学期</p>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="theme-toggle" title="切换主题" onclick="toggleTheme()">
                        <svg id="theme-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    </button>
                    <button class="icon-btn" title="导出">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                </div>
            </header>

            <!-- 合并后的考勤总览卡片 -->
            <div class="card" style="margin-bottom: 24px;">
                <div class="card-header">
                    <span class="card-label">考勤概览</span>
                    <span class="badge" style="background: var(--success-light); color: var(--success);">本学期</span>
                </div>
                
                <!-- 正常率进度条 -->
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 14px; font-weight: 600; color: var(--primary);">正常出勤率</span>
                        <span style="font-size: 20px; font-weight: 800; color: var(--success);">96.9%</span>
                    </div>
                    <div class="progress-bar" style="height: 10px; background: var(--border-light); border-radius: 5px;">
                        <div class="progress-fill" style="width: 96.9%; background: linear-gradient(90deg, var(--success), #34D399); border-radius: 5px;"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--secondary);">
                        <span>已出勤 156 次</span>
                        <span>总计 161 次</span>
                    </div>
                </div>

                <!-- 四项统计 -->
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                    <div style="text-align: center; padding: 16px 8px; background: var(--bg); border-radius: var(--radius-md); transition: all 0.3s; cursor: pointer;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--success-light); color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div style="font-size: 24px; font-weight: 800; color: var(--success);">156</div>
                        <div style="font-size: 12px; color: var(--secondary); margin-top: 2px;">正常</div>
                    </div>
                    <div style="text-align: center; padding: 16px 8px; background: var(--bg); border-radius: var(--radius-md); transition: all 0.3s; cursor: pointer;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--warning-light); color: var(--warning); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div style="font-size: 24px; font-weight: 800; color: var(--warning);">3</div>
                        <div style="font-size: 12px; color: var(--secondary); margin-top: 2px;">迟到</div>
                    </div>
                    <div style="text-align: center; padding: 16px 8px; background: var(--bg); border-radius: var(--radius-md); transition: all 0.3s; cursor: pointer;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--info-light); color: var(--info); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                        </div>
                        <div style="font-size: 24px; font-weight: 800; color: var(--info);">2</div>
                        <div style="font-size: 12px; color: var(--secondary); margin-top: 2px;">请假</div>
                    </div>
                    <div style="text-align: center; padding: 16px 8px; background: var(--bg); border-radius: var(--radius-md); transition: all 0.3s; cursor: pointer;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--danger-light); color: var(--danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        </div>
                        <div style="font-size: 24px; font-weight: 800; color: var(--danger);">0</div>
                        <div style="font-size: 12px; color: var(--secondary); margin-top: 2px;">旷课</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3 class="section-title">考勤明细</h3>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>课程</th>
                                <th>节次</th>
                                <th>状态</th>
                                <th>备注</th>

                        <tbody>
                            <tr>
                                <td>6月7日</td>

                                <td><span class="badge" style="background: var(--warning-light); color: var(--warning);">迟到</span></td>
                                <td>迟到5分钟</td>
                            </tr>
                            <tr>
                                <td>6月4日</td>

                                <td>5-6节</td>
                                <td><span class="badge" style="background: var(--info-light); color: var(--info);">请假</span></td>
                                <td>病假</td>
                            </tr>
                            <tr>
                                <td>6月3日</td>
                                <td>高等数学</td>
                                <td>1-2节</td>
                                <td><span class="badge" style="background: var(--success-light); color: var(--success);">正常</span></td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>

    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            function updateThemeUI() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const icon = document.getElementById('theme-icon');
                if (icon) {
                    icon.innerHTML = isDark
                        ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
                        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
                }
                const toggleUI = document.getElementById('theme-toggle-ui');
                if (toggleUI) {
                    toggleUI.classList.toggle('active', isDark);
                }
            }
            window.toggleTheme = function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const next = isDark ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeUI();
            };
            updateThemeUI();
        })();
    </script>
