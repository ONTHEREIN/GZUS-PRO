# 软帮手 OneGZUS — 小程序测试环境 nginx 站点
#
# 域名：test-api.onrein.top（与生产 onegzus.onrein.top 同主机、不同站点）
# 后端：127.0.0.1:8001（onegzus-test-api.service）
#
# 与生产站点的差异：
#   - 只提供 API；没有 Flutter Web 静态资源，因此没有 SPA 回退。
#   - 根路径返回一个纯文本标识，方便快速确认「打到了测试环境」。
#
# 安装（注意：目标主机是 OpenCloudOS / RHEL 系，nginx 用 conf.d 而不是 sites-available）：
#   sudo cp deploy/tencent/nginx/test-api.conf /etc/nginx/conf.d/test-api.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：用 certbot 直接签发 test-api.onrein.top。这里引用 certbot 的 live 目录
#       （与生产 onegzus.conf 一致）；续期由已有的 deploy hook
#       /etc/letsencrypt/renewal-hooks/deploy/nginx-reload.sh 自动 reload nginx。
#       注意 Let's Encrypt HTTP-01 校验要求该域名已解析到本机。

# ─── HTTP：ACME 校验 + 跳转 HTTPS ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name test-api.onrein.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS：测试 API ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test-api.onrein.top;

    ssl_certificate     /etc/letsencrypt/live/test-api.onrein.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-api.onrein.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 测试环境标识：用于确认请求没有打到生产。
    location = / {
        default_type text/plain;
        return 200 "onegzus TEST api\n";
    }

    # 维护任务只允许本机访问，永不经公网反代。
    location ^~ /api/internal/ {
        return 404;
    }

    # ─── API 反代：/api/xxx → 后端 /xxx（剥掉 /api 前缀）───────────
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        return 404;
    }
}
