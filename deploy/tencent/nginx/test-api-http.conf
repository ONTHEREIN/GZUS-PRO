# 软帮手 OneGZUS — 小程序测试环境 nginx 站点（**阶段 A：仅 HTTP**）
#
# 为什么单独有这一个文件：完整版 test-api.conf 里有 ssl_certificate 指令，
# 证书还没签发时 `nginx -t` 会直接失败；而在生产主机上做一次失败的 nginx 配置校验
# 是有风险的。所以先用这个不含 TLS 的版本把 ACME 校验路径与反代链路准备好，
# 签完证书再换成 test-api.conf。
#
# 阶段 A 作用：
#   1. 让 Let's Encrypt HTTP-01 校验可用（DNS 解析生效后即可签发）；
#   2. 让 /api 反代链路在无 TLS 的情况下也能被验证
#      curl -H 'Host: test-api.onrein.top' http://127.0.0.1/api/health/ready
#
# 安装：
#   sudo cp deploy/tencent/nginx/test-api-http.conf /etc/nginx/conf.d/test-api.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：不要修改 /etc/nginx/conf.d/onegzus.conf（生产站点）。

server {
    listen 80;
    listen [::]:80;
    server_name test-api.onrein.top;

    # ACME HTTP-01 校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 维护任务只允许本机访问，永不经公网反代。
    location ^~ /api/internal/ {
        return 404;
    }

    # 阶段 A 的反代（阶段 B 会改为 301 到 HTTPS）
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = / {
        default_type text/plain;
        return 200 "onegzus TEST api (http only, awaiting certificate)\n";
    }

    location / {
        return 404;
    }
}
