# 软帮手 OneGZUS — nginx 站点配置（腾讯云全量迁移版）
#
# 使用前：
#   1. 把下面所有 onegzus.example.com 替换为你的域名（README 第 6 节有 sed 命令）
#   2. 确认 SSL 证书已放到 /etc/nginx/ssl/onegzus/fullchain.pem 与 privkey.pem
#   3. 部署到 /etc/nginx/sites-available/onegzus.conf 并软链到 sites-enabled/
#
# 行为对齐原 Cloudflare Worker：
#   - /api/xxx            → 剥掉 /api 前缀代理到后端 /xxx
#   - /api/ws/notifications → WebSocket 升级代理（移动端实时推送）
#   - 旧版非 /api 前缀路径（/auth/*、/academic/* …）→ 兼容代理
#   - 其余 → 静态资源 + SPA 回退

# ─── HTTP：强制跳转 HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name onegzus.example.com;

    # 备案未通过时，腾讯云会拦截本机 80/443 对域名的访问；
    # 通过后此段仅做跳转，不影响功能。
    return 301 https://$host$request_uri;
}

# ─── HTTPS 主站点 ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name onegzus.example.com;
    # 如需 HTTP/2：nginx >= 1.25.1 在 server 块加一行 `http2 on;`
    # 旧版本（如 Ubuntu 22.04 的 1.18）改为 `listen 443 ssl http2;`

    ssl_certificate     /etc/nginx/ssl/onegzus/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/onegzus/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（与原 Worker / API 行为保持一致）
    # 注意：nginx 中某 location 一旦自带 add_header，server 级 add_header 就不会继承，
    #       因此下面的静态资源与 index.html location 里重复声明了同一组头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 前端静态资源根目录（Flutter Web 构建产物）
    root /opt/onegzus/web;
    index index.html;

    # 请求体上限：与后端中间件一致（10MB）
    client_max_body_size 10m;

    # ─── 静态资源：带 hash 的产物可长缓存 ──────────────────────────
    # 只用 expires（不经 add_header），保证 server 级安全头能继承；
    # 如需 immutable 可自行改为 add_header（注意同时补安全头）。
    location ~* \.(?:js|mjs|wasm|css|json|otf|ttf|woff2?|png|jpg|jpeg|webp|gif|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    # ─── SPA 入口：不缓存（每次发布 index.html 即时更新）───────────
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # ─── WebSocket（/api/ws/notifications，前端实际路径）───────────
    # 前缀匹配遵循最长匹配：/api/ws/ 优先于 /api/；正则 location 的
    # proxy_pass 不允许带 URI 部分，故这里用前缀 + 显式 URI 替换。
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── 旧版直连路径的 WebSocket 兼容（/ws/notifications）─────────
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── API 反代：/api/xxx → 后端 /xxx（剥掉 /api 前缀）───────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── 旧版非 /api 前缀的后端路径兼容（与原 Worker 行为一致）─────
    location ~ ^/(auth|academic|ehall|ecard|push|internal|staff|leave|weather|health|dashboard|exams|schedule|grades|credits|attendance|notices|me)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── SPA 回退：未命中静态资源的路径一律回 index.html ──────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
