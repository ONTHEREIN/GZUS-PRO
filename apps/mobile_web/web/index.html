<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="软帮手 OneGZUS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软帮手 | OneGZUS</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#3593FC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="软帮手">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Preload critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin>

  <style>
    #loading-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.3s ease-out;
    }
    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #3593FC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      color: #666;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      #loading-container { background: #1a1a1a; }
      .loading-spinner { border-color: #444; border-top-color: #3593FC; }
      .loading-text { color: #aaa; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">软帮手加载中...</div>
  </div>
  <script src="gzus_pwa.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading indicator once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading-container');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function() { el.remove(); }, 300);
      }
    });
  </script>
</body>
</html>
