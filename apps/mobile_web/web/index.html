<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="软帮手 OneGZUS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="gzus-build-mode" content="auto">
  <title>软帮手 | OneGZUS</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#3593FC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="软帮手">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 资源预连接：提前完成 DNS/TLS 握手，减少首次 API 请求延迟 -->
  <link rel="preconnect" href="https://onegzus.cc.cd" crossorigin>
  <link rel="dns-prefetch" href="https://onegzus.cc.cd">
  <link rel="dns-prefetch" href="https://onegzus-onweb.pages.dev">

  <!-- Preload critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    #loading-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.3s ease-out;
    }
    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #3593FC;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      color: #1f2937;
      font-size: 16px;
      font-weight: 600;
    }
    .loading-hint {
      margin-top: 8px;
      color: #6b7280;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }
    .loading-actions {
      display: none;
      gap: 10px;
      margin-top: 18px;
    }
    #loading-container.needs-help .loading-actions {
      display: flex;
    }
    .loading-button {
      appearance: none;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #111827;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 14px;
    }
    .loading-button.primary {
      border-color: #3593FC;
      background: #3593FC;
      color: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      #loading-container { background: #1a1a1a; }
      .loading-spinner { border-color: #444; border-top-color: #3593FC; }
      .loading-text { color: #f3f4f6; }
      .loading-hint { color: #a1a1aa; }
      .loading-button {
        border-color: #4b5563;
        background: #27272a;
        color: #f9fafb;
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loading-spinner"></div>
    <div id="loading-title" class="loading-text">软帮手加载中...</div>
    <div id="loading-hint" class="loading-hint">正在准备校园服务</div>
    <div class="loading-actions" aria-label="加载异常处理">
      <button id="loading-refresh" class="loading-button primary" type="button">刷新</button>
      <button id="loading-clear-cache" class="loading-button" type="button">清缓存并刷新</button>
    </div>
  </div>
  <script src="gzus_pwa.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
