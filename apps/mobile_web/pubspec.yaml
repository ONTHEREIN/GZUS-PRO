name: gzus_pro_mobile_web
description: Flutter mobile and web client for GZUS teaching affairs assistant.
publish_to: "none"
version: 0.1.1+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  web: ^1.1.1
  webview_flutter: ^4.8.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.0
  web_socket_channel: ^3.0.1
  file_picker: ^8.3.2
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  encrypt: ^5.0.3
  gbk_codec: ^0.4.0
  pointycastle: ^3.9.1

dependency_overrides:
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#3593FC"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    # 应用品牌图标，用于 LoadingPage、登录页、侧边栏与引导页。
    - assets/icon.png
