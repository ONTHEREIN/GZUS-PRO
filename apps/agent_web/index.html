<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="软帮手智能助手：独立对话页（本地运行，统一认证账号登录）">
  <title>软帮手 · 智能助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c6145'/%3E%3Cpath d='M9 12.5a3.5 3.5 0 0 1 3.5-3.5h7a3.5 3.5 0 0 1 3.5 3.5v4a3.5 3.5 0 0 1-3.5 3.5H15l-4 3v-3.2a3.5 3.5 0 0 1-2-3.3v-4Z' fill='%23dcec9b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- 登录：走后端同一套 /auth/public-key + /auth/auto-login，密码 RSA 加密后提交 -->
  <section class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>软帮手 · 智能助手</h1>
          <p>用统一认证账号登录，只读查询你本人的教务数据。</p>
        </div>
      </div>
      <label>
        <span>账号</span>
        <input id="account" name="username" autocomplete="username" required maxlength="64" placeholder="学号 / 演示账号">
      </label>
      <label>
        <span>密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      </label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="primary" type="submit" id="loginBtn">登录</button>
      <p class="fine">服务地址 <code id="apiBase"></code></p>
    </form>
  </section>

  <section class="chat" id="chatView" hidden>
    <header class="chat-top">
      <div class="chat-title">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>智能助手</strong>
          <small id="whoami"></small>
        </div>
      </div>
      <div class="chat-actions">
        <label class="toggle"><input type="checkbox" id="traceToggle"> 显示执行链路</label>
        <button type="button" class="ghost" id="newChatBtn">新对话</button>
        <button type="button" class="ghost" id="logoutBtn">退出登录</button>
      </div>
    </header>

    <main class="messages" id="messages" aria-live="polite"></main>

    <form class="composer" id="composer">
      <div class="suggestions" id="suggestions"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" maxlength="2000" placeholder="问点什么，比如「我上学期成绩怎么样」（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="primary" type="submit" id="sendBtn" aria-label="发送">发送</button>
      </div>
    </form>
  </section>

  <script src="./rsa.js"></script>
  <script src="./app.js"></script>
</body>
</html>
