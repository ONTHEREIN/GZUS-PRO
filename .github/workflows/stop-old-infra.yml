name: Stop Old Infra (Vercel + Cloudflare)

# 一次性收尾：删除旧生产基础设施（2026-08 迁移腾讯云后）
#   - Vercel 旧 API 项目（onthereins-projects/api）
#   - Cloudflare Pages 项目（onegzus-onweb / onegzus / intro-onegzus）
#   - Cloudflare KV（SESSIONS_KV）
# 触发：workflow_dispatch（手动）；token 来自仓库 Secrets，不出现在日志
# 注意：破坏性操作，执行前确认新生产（onegzus.onrein.top）已就绪

on:
  workflow_dispatch:

jobs:
  stop-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Vercel 旧 API 项目（onthereins-projects/api）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "==> 删除项目 api（team: onthereins-projects）"
          npx --yes vercel remove api --scope onthereins-projects --yes --token "$VERCEL_TOKEN" 2>&1 | grep -E "Success|Error|Removed|not found|>" | head -8
          echo "==> 确认剩余项目"
          npx --yes vercel projects ls --scope onthereins-projects --token "$VERCEL_TOKEN" 2>&1 | grep -E "Project Name|api|web" | head -6 || echo "（无项目）"

  stop-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Cloudflare Pages 项目与 KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          # 1) 用 cloudflare-bulk-delete 清空各项目 deployments（官方要求的删除前置条件）
          for proj in onegzus-onweb onegzus intro-onegzus; do
            echo "==> $proj：批量删除 deployments"
            npx --yes cloudflare-bulk-delete delete pages "$proj" 2>&1 | grep -E "completed|Deleted|error|failed" | tail -3 || true
            # 2) 删除项目本身
            echo "==> 删除项目 $proj"
            curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$CF_BASE/pages/projects/$proj" | head -c 300
            echo
          done
          # 3) KV（token 可能无 KV 权限，失败容忍）
          echo "==> 删除 KV SESSIONS_KV"
          curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_BASE/storage/kv/namespaces/09627cf70d7a493f87d8a95f20e682a0" | head -c 200
          echo
          # 4) 验证：剩余 Pages 项目
          echo "==> 验证：剩余 Pages 项目"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_BASE/pages/projects" | head -c 800
          echo
