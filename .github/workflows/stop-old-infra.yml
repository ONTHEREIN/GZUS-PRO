name: Stop Old Infra (Vercel + Cloudflare)

# 一次性收尾：删除旧生产基础设施（2026-08 迁移腾讯云后）
#   - Vercel 旧 API 项目（onthereins-projects/api）
#   - Cloudflare Pages 项目（onegzus-onweb / onegzus / intro-onegzus）
#   - Cloudflare KV（SESSIONS_KV）
# 触发：workflow_dispatch（手动）；token 来自仓库 Secrets，不出现在日志
# 注意：破坏性操作，执行前确认新生产（onegzus.onrein.top）已就绪

on:
  workflow_dispatch:

jobs:
  stop-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Vercel 旧 API 项目（onthereins-projects/api）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "==> 删除项目 api（team: onthereins-projects）"
          npx --yes vercel remove api --scope onthereins-projects --yes --token "$VERCEL_TOKEN" 2>&1 | grep -E "Success|Error|Removed|not found|>" | head -8
          echo "==> 确认剩余项目"
          npx --yes vercel projects ls --scope onthereins-projects --token "$VERCEL_TOKEN" 2>&1 | grep -E "Project Name|api|web" | head -6 || echo "（无项目）"

  stop-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Cloudflare Pages 项目（wrangler 先清 deployments 再删项目）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest --version > /dev/null 2>&1 || true  # 预热 npx 缓存
          for proj in onegzus-onweb onegzus intro-onegzus; do
            echo "==> $proj：列出 deployments"
            npx --yes wrangler@latest pages deployment list --project-name "$proj" --json \
              | jq -r '.[].id' > /tmp/ids.txt || true
            echo "    共 $(wc -l < /tmp/ids.txt) 个"
            # 逐个删除（保留最新生产部署由项目删除兜底；失败跳过不中断）
            while read -r id; do
              [ -z "$id" ] && continue
              if npx --yes wrangler@latest pages deployment delete "$id" --project-name "$proj" > /dev/null 2>&1; then
                echo "  deleted $id"
              else
                echo "  skip $id"
              fi
            done < /tmp/ids.txt
            echo "==> 删除项目 $proj"
            npx --yes wrangler@latest pages project delete "$proj" --yes 2>&1 | tail -2
          done
          echo "==> 验证：剩余 Pages 项目"
          npx --yes wrangler@latest pages project list 2>&1 | tail -8
