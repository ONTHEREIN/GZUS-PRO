name: Stop Old Infra (Vercel + Cloudflare)

# 一次性收尾：删除旧生产基础设施（2026-08 迁移腾讯云后）
#   - Vercel 旧 API 项目（onthereins-projects/api）
#   - Cloudflare Pages 项目（onegzus-onweb / onegzus / intro-onegzus）
#   - Cloudflare KV（SESSIONS_KV）
# 触发：workflow_dispatch（手动）；token 来自仓库 Secrets，不出现在日志
# 注意：破坏性操作，执行前确认新生产（onegzus.onrein.top）已就绪

on:
  workflow_dispatch:

jobs:
  stop-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Vercel 旧 API 项目（onthereins-projects/api）
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "==> 删除项目 api（team: onthereins-projects）"
          npx --yes vercel remove api --scope onthereins-projects --yes --token "$VERCEL_TOKEN" 2>&1 | grep -E "Success|Error|Removed|not found|>" | head -8
          echo "==> 确认剩余项目"
          npx --yes vercel projects ls --scope onthereins-projects --token "$VERCEL_TOKEN" 2>&1 | grep -E "Project Name|api|web" | head -6 || echo "（无项目）"

  stop-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: 删除 Cloudflare Pages 项目与 KV（REST API）
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF_BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT"
          for proj in onegzus-onweb onegzus intro-onegzus; do
            echo "==> $proj：删除所有 deployments（Cloudflare 要求先删 deployment 才能删项目）"
            page=1
            while :; do
              resp=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
                "$CF_BASE/pages/projects/$proj/deployments?per_page=50&page=$page")
              ids=$(echo "$resp" | jq -r '.result[]?.id' 2>/dev/null)
              if [ -z "$ids" ]; then break; fi
              for id in $ids; do
                curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
                  "$CF_BASE/pages/projects/$proj/deployments/$id" > /dev/null
                echo "  deleted deployment $id"
              done
              total_pages=$(echo "$resp" | jq -r '.result_info.total_pages // 1' 2>/dev/null)
              if [ "$page" -ge "$total_pages" ]; then break; fi
              page=$((page + 1))
            done
            echo "==> 删除项目 $proj"
            curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$CF_BASE/pages/projects/$proj"
            echo
          done
          echo "==> 删除 KV SESSIONS_KV"
          curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_BASE/storage/kv/namespaces/09627cf70d7a493f87d8a95f20e682a0"
          echo
          echo "==> 验证：剩余 Pages 项目"
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_BASE/pages/projects?per_page=50" | head -c 1200
          echo
          echo "==> 验证：剩余 KV 命名空间"
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "$CF_BASE/storage/kv/namespaces?per_page=50" | head -c 800
