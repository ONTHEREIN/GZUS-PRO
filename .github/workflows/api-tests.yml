name: API Tests and Lint

# 可复用工作流：后端 pytest + ruff，供 PR 检查（ci-api.yml）与 API 部署
# 工作流（deploy-prod-api.yml）调用。
# 部署工作流通过 needs: 引用本工作流，测试失败即不发版。

on:
  workflow_call:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install dependencies
        run: |
          cd services/api
          uv sync --locked --extra dev

      - name: Run tests (pytest)
        working-directory: services/api
        run: PYTHONPATH=. uv run --locked pytest

      - name: Lint (ruff)
        working-directory: services/api
        run: uv run --locked ruff check .

      - name: FastAPI smoke check
        working-directory: services/api
        env:
          DEBUG: "true"
          DATABASE_URL: sqlite:///:memory:
          CREDENTIAL_ENCRYPTION_KEY: test-key
          PUBLIC_API_BASE_URL: https://api.example.test
          FRONTEND_BASE_URL: https://app.example.test
        run: >-
          PYTHONPATH=. uv run --locked python -c
          "from app.main import create_app; assert any(route.path == '/health/ready' for route in create_app().routes)"
