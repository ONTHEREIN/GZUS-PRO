name: ECARD Reminder Cron

on:
  schedule:
    # Run every hour at :05 (UTC) → 08:05/20:05 Beijing time
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ecard reminder
        run: |
          # --fail-with-body：HTTP 4xx/5xx 时 curl 非零退出，定时任务失败会在
          # Actions 里可见（此前 -sS 会把 500/504 当成功，形成假成功）。
          # --retry 1：Vercel 冷启动偶发超时，重试一次再判失败。
          curl -sS --fail-with-body --max-time 30 \
            --retry 1 --retry-delay 10 --retry-all-errors \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "https://onegzus.cc.cd/internal/cron/ecard-reminder"
