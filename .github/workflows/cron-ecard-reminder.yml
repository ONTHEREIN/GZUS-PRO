name: ECARD Reminder Cron

on:
  schedule:
    # Run every hour at :05 (UTC) → 08:05/20:05 Beijing time
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ecard reminder
        run: |
          curl -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            --max-time 15 \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            "https://api-one-zeta-dc0jrazxzq.vercel.app/internal/cron/ecard-reminder"
