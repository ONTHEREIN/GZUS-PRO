name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://onegzus-onweb.pages.dev/api' }}
        run: |
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL" --no-web-resources-cdn

      - name: Deploy to Cloudflare Pages (onegzus-onweb)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus-onweb --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (onegzus)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
