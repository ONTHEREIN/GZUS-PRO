name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set repository variable or secret API_BASE_URL to your Vercel API URL."
            exit 1
          fi
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
