name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://onegzus.cc.cd/api,https://onegzus-onweb.pages.dev/api' }}
        run: |
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL" --no-web-resources-cdn

      - name: Clean build output
        run: |
          cd apps/mobile_web/build/web
          # 移除调试符号文件
          find . -name "*.symbols" -delete
          # 保留 chromium CanvasKit：Flutter Web 在 Chromium 浏览器会优先选择该变体。
          # 删除它会让启动阶段请求回落到 SPA HTML，导致登录页一直停在加载界面。
          rm -rf canvaskit/experimental_webparagraph
          rm -f canvaskit/skwasm*.wasm canvaskit/skwasm*.js
          rm -f canvaskit/wimp.wasm canvaskit/wimp.js
          # 移除 NOTICE 文件
          rm -f assets/NOTICES
          echo "=== Cleaned build size ==="
          du -sh .

      - name: Verify deployable web bundle
        run: |
          test -f apps/mobile_web/build/web/main.dart.js
          test -f apps/mobile_web/build/web/canvaskit/canvaskit.js
          test -f apps/mobile_web/build/web/canvaskit/canvaskit.wasm
          test -f apps/mobile_web/build/web/canvaskit/chromium/canvaskit.js
          test -f apps/mobile_web/build/web/canvaskit/chromium/canvaskit.wasm
          ! grep -q "{{flutter_" apps/mobile_web/build/web/flutter_bootstrap.js
          grep -q "canvasKitVariant: 'full'" apps/mobile_web/build/web/flutter_bootstrap.js

      - name: Deploy to Cloudflare Pages (onegzus-onweb)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus-onweb --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (onegzus)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
