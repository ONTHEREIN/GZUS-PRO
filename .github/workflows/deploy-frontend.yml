name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/mobile_web/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    uses: ./.github/workflows/frontend-tests.yml

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://onegzus.cc.cd/api,https://onegzus-onweb.pages.dev/api' }}
        run: |
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL" --no-web-resources-cdn

      - name: Clean build output
        run: |
          cd apps/mobile_web/build/web
          # 移除调试符号文件
          find . -name "*.symbols" -delete
          # 保留 chromium CanvasKit：Flutter Web 在 Chromium 浏览器会优先选择该变体。
          # 删除它会让启动阶段请求回落到 SPA HTML，导致页面停在加载界面。
          rm -rf canvaskit/experimental_webparagraph
          rm -f canvaskit/skwasm*.wasm canvaskit/skwasm*.js
          rm -f canvaskit/wimp.wasm canvaskit/wimp.js
          # 移除 NOTICE 文件
          rm -f assets/NOTICES
          echo "=== Cleaned build size ==="
          du -sh .
          echo "=== canvaskit/ contents ==="
          ls -la canvaskit/ || true

      - name: Verify deployable web bundle
        run: |
          set -x
          test -f apps/mobile_web/build/web/main.dart.js
          test -f apps/mobile_web/build/web/gzus_pwa.js
          test -f apps/mobile_web/build/web/gzus_pwa_sw.js
          test -f apps/mobile_web/build/web/canvaskit/canvaskit.js
          test -f apps/mobile_web/build/web/canvaskit/canvaskit.wasm
          test -f apps/mobile_web/build/web/canvaskit/chromium/canvaskit.js
          test -f apps/mobile_web/build/web/canvaskit/chromium/canvaskit.wasm
          test -f apps/mobile_web/build/web/assets/fonts/MaterialIcons-Regular.otf
          test -n "$(find apps/mobile_web/build/web -maxdepth 1 -name 'main.dart.js_*.part.js' -print -quit)"
          test -f apps/mobile_web/build/web/icons/icon-192x192.png
          test -f apps/mobile_web/build/web/icons/icon-512x512.png
          test -f apps/mobile_web/build/web/manifest.json
          ! grep -q "{{flutter_" apps/mobile_web/build/web/flutter_bootstrap.js
          ! grep -q "canvasKitVariant: 'full'" apps/mobile_web/build/web/flutter_bootstrap.js

      - name: Deploy to Cloudflare Pages (onegzus-onweb)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus-onweb --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (onegzus)
        run: npx wrangler@latest pages deploy apps/mobile_web/build/web --project-name=onegzus --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live static assets
        run: |
          set -euo pipefail
          part_asset="$(find apps/mobile_web/build/web -maxdepth 1 -name 'main.dart.js_*.part.js' -printf '%f\n' | sort -V | head -n 1)"
          test -n "$part_asset"
          check_asset() {
            local base_url="$1"
            local path="$2"
            local expected="$3"
            local attempt
            local headers
            local content_type
            for attempt in 1 2 3 4 5; do
              headers="$(mktemp)"
              if curl -fsSL -D "$headers" -o /tmp/onegzus-asset "$base_url$path"; then
                content_type="$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs)"
                echo "$base_url$path -> $content_type ($(wc -c < /tmp/onegzus-asset) bytes)"
                if echo "$content_type" | grep -qi 'text/html'; then
                  echo "$base_url$path returned HTML instead of $expected; retrying ($attempt/5)"
                elif echo "$content_type" | grep -qi "$expected"; then
                  return 0
                else
                  echo "$base_url$path returned unexpected content type: $content_type; retrying ($attempt/5)"
                fi
              else
                echo "$base_url$path is not available yet; retrying ($attempt/5)"
              fi
              sleep 6
            done
            echo "::error::$base_url$path did not become available as $expected"
            exit 1
          }
          for base in "https://onegzus.cc.cd" "https://onegzus-onweb.pages.dev"; do
            check_asset "$base" "/main.dart.js" "javascript"
            check_asset "$base" "/$part_asset" "javascript"
            check_asset "$base" "/flutter_bootstrap.js" "javascript"
            check_asset "$base" "/gzus_pwa.js" "javascript"
            check_asset "$base" "/gzus_pwa_sw.js" "javascript"
            check_asset "$base" "/manifest.json" "json"
            check_asset "$base" "/assets/fonts/MaterialIcons-Regular.otf" "font\\|octet-stream"
            check_asset "$base" "/canvaskit/canvaskit.js" "javascript"
            check_asset "$base" "/canvaskit/canvaskit.wasm" "wasm"
            check_asset "$base" "/canvaskit/chromium/canvaskit.js" "javascript"
            check_asset "$base" "/canvaskit/chromium/canvaskit.wasm" "wasm"
          done
