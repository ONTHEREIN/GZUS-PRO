name: WeChat Sync Cron

on:
  schedule:
    # 每 6 小时同步一次公众号文章（UTC 0/6/12/18 → 北京 8/14/20/次日2 点）
    - cron: '20 */6 * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wechat article sync
        run: |
          # --fail-with-body：HTTP 4xx/5xx 时 curl 非零退出，定时任务失败会在
          # Actions 里可见（此前 -sS 会把 500/504 当成功，形成假成功）。
          # --retry 1：Vercel 冷启动偶发超时，重试一次再判失败。
          curl -sS --fail-with-body --max-time 90 \
            --retry 1 --retry-delay 10 --retry-all-errors \
            -H "X-Internal-Key: ${{ secrets.INTERNAL_API_KEY }}" \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "https://onegzus.cc.cd/internal/cron/wechat-sync"
