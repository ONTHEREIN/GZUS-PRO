name: Deploy Frontend to Tencent Production

# 推送到 master 后自动构建 Flutter Web 并部署到腾讯云生产服务器
# （onegzus.onrein.top / 106.55.2.248，nginx 静态托管）

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_web/**'
  workflow_dispatch:

permissions:
  contents: read

# 并发保护：同一时间只跑一个部署，新触发取消旧的（避免 rsync 冲突）
concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: false

jobs:
  test-and-lint:
    uses: ./.github/workflows/frontend-tests.yml

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          # 仓库 Variables/Secrets 里可配 API_BASE_URL 覆盖默认值
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://onegzus.onrein.top/api' }}
        run: |
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL" --no-web-resources-cdn
          # 清理（与旧 CI 一致：去调试符号/多余 CanvasKit 变体/NOTICES）
          cd build/web
          find . -name "*.symbols" -delete
          rm -rf canvaskit/experimental_webparagraph
          rm -f canvaskit/skwasm*.wasm canvaskit/skwasm*.js
          rm -f canvaskit/wimp.wasm canvaskit/wimp.js
          rm -f assets/NOTICES

      - name: Deploy to Tencent (rsync + nginx reload)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SSH_COMMAND="ssh -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          RELEASE_ID="$GITHUB_SHA"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s --' "$RELEASE_ID" <<'REMOTE'
          release_id="$1"
          install -d -o onegzus -g onegzus "/opt/onegzus/releases/web/$release_id"
          REMOTE
          rsync -avz --delete -e "$SSH_COMMAND" \
            apps/mobile_web/build/web/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/onegzus/releases/web/$RELEASE_ID/"
          rsync -avz --delete -e "$SSH_COMMAND" --exclude '.ssh/' \
            deploy/tencent/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/onegzus/deploy/"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/onegzus/deploy/scripts/install_runtime.sh"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          if ! command -v certbot >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y certbot python3-certbot-nginx
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-nginx
            else
              echo "未找到受支持的包管理器，无法安装 certbot" >&2
              exit 1
            fi
          fi
          systemctl enable --now certbot-renew.timer
          for attempt in {1..12}; do
            if bash /opt/onegzus/deploy/scripts/issue_letsencrypt.sh onegzus.onrein.top; then
              exit 0
            fi
            if ! pgrep -f '[c]ertbot' >/dev/null; then
              exit 1
            fi
            echo "certbot 已被其他任务占用，${attempt}/12，10 秒后重试" >&2
            sleep 10
          done
          echo "certbot 持续被占用，停止发布" >&2
          exit 1
          REMOTE
          ssh -i "$HOME/.ssh/deploy_key" \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s --' "$RELEASE_ID" <<'REMOTE'
          release_id="$1"
          release_dir="/opt/onegzus/releases/web/$release_id"
          chown -R onegzus:onegzus "$release_dir"
          bash /opt/onegzus/deploy/scripts/activate_release.sh web "$release_id"
          curl -fsS --max-time 10 https://onegzus.onrein.top/ >/dev/null
          REMOTE
          echo "=== 前端版本已原子激活 ==="
