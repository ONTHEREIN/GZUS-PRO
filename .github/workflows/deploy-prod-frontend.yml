name: Deploy Frontend to Tencent Production

# 推送到 master 后自动构建 Flutter Web 并部署到腾讯云生产服务器
# （onegzus.onrein.top / 106.55.2.248，nginx 静态托管）

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile_web/**'
  workflow_dispatch:

permissions:
  contents: read

# 并发保护：同一时间只跑一个部署，新触发取消旧的（避免 rsync 冲突）
concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: false

jobs:
  test-and-lint:
    uses: ./.github/workflows/frontend-tests.yml

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: |
          cd apps/mobile_web
          flutter pub get

      - name: Build Web
        env:
          # 仓库 Variables/Secrets 里可配 API_BASE_URL 覆盖默认值
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL || 'https://onegzus.onrein.top/api' }}
        run: |
          cd apps/mobile_web
          flutter build web --release --base-href "/" --dart-define=API_BASE_URL="$API_BASE_URL" --no-web-resources-cdn
          # 清理（与旧 CI 一致：去调试符号/多余 CanvasKit 变体/NOTICES）
          cd build/web
          find . -name "*.symbols" -delete
          rm -rf canvaskit/experimental_webparagraph
          rm -f canvaskit/skwasm*.wasm canvaskit/skwasm*.js
          rm -f canvaskit/wimp.wasm canvaskit/wimp.js
          rm -f assets/NOTICES

      - name: Deploy to Tencent (rsync + nginx reload)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -n "$DEPLOY_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export SSH_CMD="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          export RELEASE_ID="$GITHUB_SHA"
          ssh $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -o onegzus -g onegzus /opt/onegzus/releases/web/$RELEASE_ID"
          rsync -avz --delete -e "$SSH_CMD" \
            apps/mobile_web/build/web/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/onegzus/releases/web/$RELEASE_ID/"
          rsync -avz --delete -e "$SSH_CMD" --exclude '.ssh/' \
            deploy/tencent/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/onegzus/deploy/"
          ssh $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /opt/onegzus/deploy/scripts/install_runtime.sh"
          ssh $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" \
            "chown -R onegzus:onegzus /opt/onegzus/releases/web/$RELEASE_ID && bash /opt/onegzus/deploy/scripts/activate_release.sh web $RELEASE_ID && curl -fsS --max-time 10 https://onegzus.onrein.top/ >/dev/null"
          echo "=== 前端版本已原子激活 ==="
